[package]
name = "promptub"
version = "0.5.14"
description = "Player de musica leve — estilo terminal"
authors = ["promptub"]
edition = "2021"

[lib]
name = "promptub_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
encoding_rs = "0.8"
parking_lot = "0.12"
ureq = { version = "2.10", features = ["json"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
